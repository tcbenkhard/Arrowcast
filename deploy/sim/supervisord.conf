[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:network]
command=python3 -u /opt/sim/network_sim.py
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=node apps/api/dist/server.js
directory=/opt/arrowcast/current
user=arrowcast
priority=20
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/arrowcast/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:logs]
command=tail -n +1 -F /var/log/arrowcast/backend.log /var/log/arrowcast/frontend.log /var/log/arrowcast/updates.log
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
