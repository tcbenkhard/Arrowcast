# DHCP only on the ArrowCast hotspot. Ethernet DHCP remains NetworkManager's job.
interface=wlan0
bind-dynamic
port=0
user=nobody
group=nogroup
dhcp-authoritative
dhcp-range=10.42.0.10,10.42.0.250,255.255.255.0,12h
dhcp-leasefile=/run/arrowcast-dhcp/leases
# Do not advertise an internet gateway or DNS server. This is a local network.
dhcp-option=option:router
dhcp-option=option:dns-server
