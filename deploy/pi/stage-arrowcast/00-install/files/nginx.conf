server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    add_header Cache-Control "no-store" always;
    return 404;
}

# Administration is addressed by the local device name or a local IP. Reject
# public hostnames even when a router mistakenly forwards to this listener.
# The router must still forward internet traffic exclusively to 8080/8443.
server {
    listen 80;
    listen [::]:80;
    server_name arrowcast.local arrowcast localhost
        ~^127\.[0-9.]+$
        ~^10\.[0-9.]+$
        ~^192\.168\.[0-9.]+$
        ~^172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+$
        ~^\[(::1|f[cd][0-9a-f:]+|fe[89ab][0-9a-f:]+)\]$;
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow ::1;
    allow fc00::/7;
    allow fe80::/10;
    deny all;
    root /opt/arrowcast/current/apps/web/dist;
    access_log off;
    error_log syslog:server=unix:/dev/log,tag=arrowcast_web warn;
    client_max_body_size 1m;
    if (-f /var/lib/arrowcast-update/maintenance) { return 503; }

    location = / { return 302 /admin; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
