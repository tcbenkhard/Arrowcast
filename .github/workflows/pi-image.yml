name: Raspberry Pi image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require signing configuration for releases
        if: github.ref_type == 'tag'
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.ARROWCAST_UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$UPDATE_PRIVATE_KEY" && test -n "$UPDATE_PUBLIC_KEY" || {
            echo 'Configure ARROWCAST_UPDATE_PRIVATE_KEY (secret) and ARROWCAST_UPDATE_PUBLIC_KEY (variable).'
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check image scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find deploy/pi -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck -x deploy/pi/build-image.sh deploy/pi/stage-arrowcast/prerun.sh \
            deploy/pi/stage-arrowcast/00-install/00-run.sh \
            deploy/pi/stage-arrowcast/00-install/files/*.sh
      - name: Test update broker
        run: python3 -m unittest discover -s deploy/pi/tests -v

  image:
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pi-gen build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod openssl python3
          df -h .
      - name: Build native ARM64 appliance image
        env:
          IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
        run: |
          sudo env ARROWCAST_IMAGE_VERSION="$IMAGE_VERSION" \
            ARROWCAST_UPDATE_REPOSITORY="$UPDATE_REPOSITORY" \
            ARROWCAST_UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY" bash deploy/pi/build-image.sh
      - name: Upload installation image
        uses: actions/upload-artifact@v4
        with:
          name: arrowcast-pi-${{ github.sha }}
          path: .pi-build/output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pi-image-build-logs-${{ github.sha }}
          path: |
            .pi-build/pi-gen/work/**/build.log
            .pi-build/pi-gen/work/**/debootstrap.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arrowcast-pi-${{ github.sha }}
          path: image
      - name: Sign application update manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.ARROWCAST_UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UPDATE_PRIVATE_KEY" && -n "$UPDATE_PUBLIC_KEY" ]]
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file" public.pem' EXIT
          printf '%s\n' "$UPDATE_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$UPDATE_PUBLIC_KEY" > public.pem
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          package = Path('image/arrowcast-update.tar.xz')
          manifest = {'format': 1, 'platform': 'raspios-trixie-arm64',
                      'version': os.environ['RELEASE_TAG'], 'file': package.name,
                      'size': package.stat().st_size,
                      'sha256': hashlib.file_digest(package.open('rb'), 'sha256').hexdigest()}
          Path('image/update.json').write_text(json.dumps(manifest) + '\n')
          PY
          openssl dgst -sha256 -sign "$key_file" -out image/update.sig image/update.json
          openssl dgst -sha256 -verify public.pem -signature image/update.sig image/update.json
      - name: Create draft release and attach image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Reruns may replace files only while the release is still a draft.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json > /dev/null
          else
            cat > notes.md <<'NOTES'
          Native Raspberry Pi 4/5 ARM64 installation image (no Docker).

          Download the .img.xz file and use Raspberry Pi Imager's Use Custom option.
          Join the open ArrowCast Wi-Fi and open http://10.42.0.1/admin.
          Log in with admin / admin and choose a new password before continuing.
          See INSTALLATION.md for instructions and current limitations.

          Maintainer: test this exact image on Pi 4 and Pi 5 before publishing.
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Arrowcast $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" image/* --clobber
