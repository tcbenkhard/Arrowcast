name: Raspberry Pi image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: pi-image-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require releases to run from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Run this workflow from main.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate signing configuration for releases
        env:
          ARROWCAST_UPDATE_PRIVATE_KEY: ${{ secrets.ARROWCAST_UPDATE_PRIVATE_KEY }}
          ARROWCAST_UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
        run: python3 deploy/pi/signing.py --require-private
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check image scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nginx-light
          find deploy/pi -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck -x deploy/pi/build-image.sh deploy/pi/stage-arrowcast/prerun.sh \
            deploy/pi/stage-arrowcast/00-install/00-run.sh \
            deploy/pi/stage-arrowcast/00-install/files/*.sh
      - name: Test update broker
        run: python3 -m unittest discover -s deploy/pi/tests -v

  version:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bump package version and push release tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          # Reuse this run's tag when retrying a failed image build or upload.
          marker="Arrowcast release run $GITHUB_RUN_ID"
          while IFS= read -r tag; do
            if [[ "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")" == "$marker" ]]; then
              [[ "$(git rev-parse "$tag^1")" == "$GITHUB_SHA" ]]
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(git tag --list 'v[0-9]*')
          case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
          npm version "$BUMP" --no-git-tag-version --workspaces=false --ignore-scripts
          tag="v$(node -p "require('./package.json').version")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release $tag"
          git tag -a "$tag" -m "$marker"
          # Fail without publishing either ref if main advanced since checks ran.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install pi-gen build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod openssl python3
          df -h .
      - name: Build native ARM64 appliance image
        env:
          IMAGE_VERSION: ${{ needs.version.outputs.tag }}
          UPDATE_REPOSITORY: ${{ github.repository }}
          UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
        run: |
          sudo env ARROWCAST_IMAGE_VERSION="$IMAGE_VERSION" \
            ARROWCAST_UPDATE_REPOSITORY="$UPDATE_REPOSITORY" \
            ARROWCAST_UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY" bash deploy/pi/build-image.sh
      - name: Upload installation image
        uses: actions/upload-artifact@v4
        with:
          name: arrowcast-pi-${{ needs.version.outputs.tag }}
          path: .pi-build/output/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pi-image-build-logs-${{ github.sha }}
          overwrite: true
          path: |
            .pi-build/pi-gen/work/**/build.log
            .pi-build/pi-gen/work/**/debootstrap.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: arrowcast-pi-${{ needs.version.outputs.tag }}
          path: image
      - name: Sign application update manifest
        env:
          ARROWCAST_UPDATE_PRIVATE_KEY: ${{ secrets.ARROWCAST_UPDATE_PRIVATE_KEY }}
          ARROWCAST_UPDATE_PUBLIC_KEY: ${{ vars.ARROWCAST_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file" public.pem' EXIT
          python3 deploy/pi/signing.py --private-output "$key_file" --public-output public.pem
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          package = Path('image/arrowcast-update.tar.xz')
          manifest = {'format': 1, 'platform': 'raspios-trixie-arm64',
                      'version': os.environ['RELEASE_TAG'], 'file': package.name,
                      'size': package.stat().st_size,
                      'sha256': hashlib.file_digest(package.open('rb'), 'sha256').hexdigest()}
          Path('image/update.json').write_text(json.dumps(manifest) + '\n')
          PY
          openssl dgst -sha256 -sign "$key_file" -out image/update.sig image/update.json
          openssl dgst -sha256 -verify public.pem -signature image/update.sig image/update.json
      - name: Create release, attach image and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in arrowcast-update.tar.xz update.json update.sig; do
            test -s "image/$asset"
          done
          # Reruns may replace files only while the release is still a draft.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json > /dev/null
          else
            cat > notes.md <<'NOTES'
          Native Raspberry Pi 4/5 ARM64 installation image (no Docker).

          Download the .img.xz file and use Raspberry Pi Imager's Use Custom option.
          Join the open ArrowCast Wi-Fi and open http://10.42.0.1/admin.
          Log in with admin / admin and choose a new password before continuing.
          See INSTALLATION.md for instructions and current limitations.

          Physical boot and networking on Pi 4 and Pi 5 require separate validation.
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Arrowcast $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" image/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
